name: aveditor
description: Short-form video editor with timeline text overlays and YouTube Shorts upload.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  video_player: ^2.9.2
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  share_lib:
    path: ../../flutter_share_lib
  gal: ^2.3.3
  ffmpeg_kit_flutter_new: ^4.6.2
  shared_preferences: ^2.5.3
  http: ^1.4.0
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/fonts/Arial.ttf
  fonts:
    # Pinned so overlay text lays out identically in the preview and the export.
    - family: OverlayText
      fonts:
        - asset: assets/fonts/Arial.ttf
