name: aveditor
description: Short-form video editor with timeline text overlays and YouTube Shorts upload.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  video_player: ^2.9.2
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2
  google_fonts: ^6.2.1
  share_lib:
    path: ../../flutter_share_lib
  gal: ^2.3.3
  shared_preferences: ^2.5.3
  http: ^1.4.0
  share_plus: ^7.2.2
  url_launcher: ^6.2.2
  audioplayers: ^6.4.0
  video_thumbnail: ^0.5.6
  lottie: ^3.5.1
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 5.3.1 still calls configurations.all, which Gradle 9 removed.
  google_mobile_ads: 9.1.0
  # Published 0.5.6 calls jcenter() and pins AGP 4.1.0, both rejected by Gradle 9.
  video_thumbnail:
    path: third_party/video_thumbnail
  # Stock picker sends no media capabilities, so Google Photos returns the original
  # Dolby Vision file. This copy asks the picker to transcode HDR the device cannot decode.
  image_picker_android:
    path: third_party/image_picker_android

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/fonts/Arial.ttf
    - assets/fonts/SpaceGrotesk-SemiBold.ttf
    - assets/fonts/SpaceGrotesk-Bold.ttf
    - assets/fonts/DMSans-Regular.ttf
    - assets/fonts/DMSans-SemiBold.ttf
    - assets/icons/
    - assets/text_packs/catalog.json
    - assets/text_packs/lottie/
    - assets/transitions/catalog.json
  fonts:
    # Pinned so overlay text lays out identically in the preview and the export.
    - family: OverlayText
      fonts:
        - asset: assets/fonts/Arial.ttf
