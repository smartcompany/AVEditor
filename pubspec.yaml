name: aveditor
description: Short-form video editor with timeline text overlays and YouTube Shorts upload.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  video_player: ^2.9.2
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2
  google_fonts: ^6.2.1
  share_lib:
    path: ../../flutter_share_lib
  gal: ^2.3.3
  shared_preferences: ^2.5.3
  http: ^1.4.0
  image: ^4.5.4
  share_plus: ^7.2.2
  url_launcher: ^6.2.2
  audioplayers: ^6.4.0
  video_thumbnail: ^0.5.6
  lottie: ^3.5.1
  characters: ^1.4.0
  # Used only when the platform player cannot open a picked file.
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.7
  in_app_purchase: ^3.2.3
  package_info_plus: ^8.3.1
  flutter_web_auth_2: ^5.1.0
  photo_manager: ^3.12.0
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  record: ^7.2.0
  provider: ^6.1.2
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  kakao_flutter_sdk_common: ^1.9.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 5.3.1 still calls configurations.all, which Gradle 9 removed.
  google_mobile_ads: 9.1.0
  # Published 0.5.6 calls jcenter() and pins AGP 4.1.0, both rejected by Gradle 9.
  video_thumbnail:
    path: third_party/video_thumbnail
  # Gallery pick stays on the photo picker. Do not attach media capabilities:
  # the system then transcodes on open and drops the file when the format differs.
  image_picker_android:
    path: third_party/image_picker_android

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/fonts/SpaceGrotesk-SemiBold.ttf
    - assets/fonts/SpaceGrotesk-Bold.ttf
    - assets/fonts/DMSans-Regular.ttf
    - assets/fonts/DMSans-SemiBold.ttf
    - assets/icons/
    - assets/text_packs/lottie/
    - assets/text_packs/journal/
    - assets/transitions/catalog.json
    - assets/backgrounds/
  fonts:
    # Pinned so overlay text lays out identically in the preview and the export.
    # Do not ship Apple system faces (e.g. Arial) — ITMS-91198.
    - family: OverlayText
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
